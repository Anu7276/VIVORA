services:
  - type: web
    name: vivora-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////tmp/vivora.db
      - key: STT_PROVIDER
        value: browser
      - key: TTS_PROVIDER
        value: browser
      - key: QUESTION_GEN_PROVIDER
        value: groq
      - key: LIVE_PROVIDER
        value: groq
      - key: EVALUATION_PROVIDER
        value: groq
      - key: REPORT_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
