version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: vivora_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./vivora.db
      - LLM_PROVIDER=mock
      - STT_PROVIDER=browser
      - TTS_PROVIDER=browser
    volumes:
      - ../backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: vivora_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
