name: VIVORA CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Database Migrations Check
        run: |
          cd backend
          alembic upgrade head
      - name: Run Backend Pytest Suite
        run: |
          cd backend
          pytest tests -v
        env:
          ENV: test
          JWT_SECRET_KEY: test_jwt_secret_key_for_ci_pipeline_only_32_bytes_long

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Production Security Audit
        run: |
          cd frontend
          npm audit --omit=dev
      - name: Build Next.js Application
        run: |
          cd frontend
          npm run build

